name: Monthly Creature Database Update

on:
  schedule:
    # Runs at 6:00 AM UTC on the 15th of every month
    - cron: '0 6 15 * *'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install

      - name: Run scraper
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: |
          cd .github/scripts
          node scrape.js

      - name: Commit and push updated index.html
        run: |
          git config user.name "JWA Bot"
          git config user.email "jwa-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: monthly creature database update $(date +'%Y-%m-%d')"
          git push
