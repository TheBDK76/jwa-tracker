<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWA DNA Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>

  .header-icon { font-size: 32px; }
  .header-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; color: #4af; letter-spacing: 3px; }
  .header-sub { font-size: 11px; color: #4a8aaa; letter-spacing: 2px; }
  .header-bdk { font-size: 11px; color: #ffffff; letter-spacing: 1px; margin-top: 3px; font-weight: 600; }
  .header-count { margin-left: auto; text-align: right; }
  .header-count-num { font-size: 22px; font-weight: 700; color: #4af; font-family: 'Orbitron', sans-serif; }
  .header-count-label { font-size: 10px; color: #4a8aaa; letter-spacing: 1px; }
  .bdk-banner { background: #0a0a0a; border-bottom: 1px solid #222; padding: 6px 0; text-align: center; font-size: 12px; color: #fff; font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; font-weight: 600; }
  .tabs { display: flex; border-bottom: 1px solid #0a3050; background: #040e1a; position: sticky; top: 100px; z-index: 9; }
  .tab { flex: 1; padding: 10px 2px; border: none; cursor: pointer; background: transparent; color: #4a7a9a; font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { background: #0a2040; color: #4af; border-bottom-color: #4af; }
  .rarity-filter { display: flex; gap: 6px; padding: 10px 14px; background: #040e1a; border-bottom: 1px solid #0a2030; flex-wrap: wrap; }
  .rarity-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid #1a3050; background: transparent; color: #4a7a9a; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: 1px; font-family: 'Rajdhani', sans-serif; transition: all 0.2s; }
  .content { padding: 14px; max-width: 900px; margin: 0 auto; }
  .empty-state { text-align: center; padding: 60px 20px; color: #2a5070; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-title { font-family: 'Orbitron', sans-serif; font-size: 13px; }
  .empty-sub { font-size: 12px; margin-top: 8px; color: #1a3040; }
  .card { border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card-name { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .section-group { font-family: 'Orbitron', sans-serif; font-size: 10px; color: #2a6080; letter-spacing: 2px; padding: 6px 0 4px; border-bottom: 1px solid #0a2030; margin-bottom: 10px; }
  .progress-row { margin-bottom: 5px; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  .progress-bar { height: 4px; background: #0a2030; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .chain-tree { margin-top: 8px; padding: 8px; background: #040e14; border-radius: 6px; font-size: 11px; }
  .chain-row { padding: 3px 0; display: flex; align-items: flex-start; gap: 6px; }

  .chain-icon { width: 14px; flex-shrink: 0; }
  input[type="text"], input[type="number"], input[type="password"], input[type="search"], textarea { background: #080f1a; border: 1px solid #0a3050; border-radius: 8px; color: #c8e6ff; font-family: 'Rajdhani', sans-serif; font-size: 13px; outline: none; padding: 9px 12px; width: 100%; }

<body>

  { name:"Indoraptor",      rarity:"Legendary", createThreshold:200, components:[{name:"Indominus Rex",costPerFuse:50},      {name:"Velociraptor",costPerFuse:2000}] },

  { name:"Ardentismaxima",  rarity:"Legendary", createThreshold:200, components:[{name:"Ardontosaurus",costPerFuse:50},      {name:"Brachiosaurus",costPerFuse:50}] },
  { name:"Grypolyth",       rarity:"Legendary", createThreshold:200, components:[{name:"Gryposuchus",costPerFuse:50},        {name:"Purrolyth",costPerFuse:200}] },
  { name:"Skoonasaurus",    rarity:"Legendary", createThreshold:200, components:[{name:"Ankylomoloch",costPerFuse:50},       {name:"Sonorasaurus",costPerFuse:50}] },

  { name:"Indoraptor Gen 2",rarity:"Unique", createThreshold:250, components:[{name:"Indominus Rex Gen 2",costPerFuse:50},  {name:"Blue",costPerFuse:50}] },

  { name:"Trykosaurus",     rarity:"Unique", createThreshold:250, components:[{name:"Tryostronix",costPerFuse:50},          {name:"Tyrannosaurus Rex",costPerFuse:2000}] },
  { name:"Tuoramoloch",     rarity:"Unique", createThreshold:250, components:[{name:"Tuojiangosaurus",costPerFuse:50},      {name:"Parasaurolophus",costPerFuse:2000}] },
  { name:"Erlikospyx",      rarity:"Unique", createThreshold:250, components:[{name:"Erlikosaurus",costPerFuse:50},         {name:"Spinotasuchus",costPerFuse:50}] },
  { name:"Geminititan",     rarity:"Unique", createThreshold:250, components:[{name:"Diplodocus",costPerFuse:50},           {name:"Argentinosaurus",costPerFuse:2000}] },
  { name:"Smilonemys",      rarity:"Unique", createThreshold:250, components:[{name:"Smilodon",costPerFuse:50},             {name:"Carbonemys",costPerFuse:2000}] },
  { name:"Mammolania",      rarity:"Unique", createThreshold:250, components:[{name:"Mammoth",costPerFuse:50},              {name:"Carbonemys",costPerFuse:2000}] },
  { name:"Mortem Rex",      rarity:"Unique", createThreshold:250, components:[{name:"Tyrannosaurus Rex",costPerFuse:50},    {name:"Carnotaurus",costPerFuse:2000}] },
  { name:"Ceramagnus",      rarity:"Unique", createThreshold:250, components:[{name:"Megalonyx",costPerFuse:50},            {name:"Nasutoceratops",costPerFuse:2000}] },
  { name:"Testacornibus",   rarity:"Unique", createThreshold:250, components:[{name:"Woolly Rhino",costPerFuse:50},         {name:"Nasutoceratops",costPerFuse:2000}] },

const RECIPE_MAP = {};
FUSION_RECIPES.forEach(r => { RECIPE_MAP[r.name] = r; });

// Which hybrids use each creature as a component
const USED_IN_MAP = {};
FUSION_RECIPES.forEach(r => {
  r.components.forEach(c => {
    if (!USED_IN_MAP[c.name]) USED_IN_MAP[c.name] = [];
    USED_IN_MAP[c.name].push(r.name);
  });
});

const RARITY_CONFIG = {
  Rare:      {color:"#4a9eff", bg:"#0d1f3c", badge:"#1a3a6b"},
  Epic:      {color:"#f5d623", bg:"#2a2000", badge:"#5a4a00"},
  Legendary: {color:"#e84545", bg:"#2a0a0a", badge:"#5a1a1a"},
  Unique:    {color:"#4af594", bg:"#0d2a1a", badge:"#1a5a35"},
};

const ALL_COMPONENTS = [...new Set(FUSION_RECIPES.flatMap(r => r.components.map(c => c.name)))].sort();

// ── Name normalization for Gemini output matching ─────────────────────────────
function normalizeName(name) {
  return name.toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/gen\./g, 'gen')
    .replace(/[^a-z0-9 ]/g, '')
    .trim();
}

const NORMALIZED_INVENTORY_KEYS = {}; // built at runtime

function buildNormalizedKeys(inventory) {
  Object.keys(inventory).forEach(k => {
    NORMALIZED_INVENTORY_KEYS[normalizeName(k)] = k;
  });
}

function matchInventoryName(rawName) {
  // Try exact first
  if (dnaInventory[rawName] !== undefined) return rawName;
  // Try normalized
  const norm = normalizeName(rawName);
  if (NORMALIZED_INVENTORY_KEYS[norm]) return NORMALIZED_INVENTORY_KEYS[norm];
  return rawName; // fallback to original
}

// ── Chain fusion engine ───────────────────────────────────────────────────────
function fusesAvailableFor(componentName, costPerFuse, inventory, depth) {
  if (depth > 6) return 0;
  const have = inventory[componentName] || 0;
  if (have > 0) return Math.floor(have / costPerFuse);

  // Not in inventory — is it a hybrid we could create?
  const recipe = RECIPE_MAP[componentName];
  if (!recipe) return 0;

  const ev = evaluateFusion(recipe, inventory, depth + 1);
  if (ev.canCreate) return Math.floor(recipe.createThreshold / costPerFuse);
  return 0;
}

function evaluateFusion(recipe, inventory, depth = 0) {
  const alreadyHave = (inventory[recipe.name] || 0) > 0;

  const components = recipe.components.map(c => {
    const have = inventory[c.name] || 0;
    const fusesFromInventory = have > 0 ? Math.floor(have / c.costPerFuse) : 0;
    const source = have > 0 ? 'inventory' : RECIPE_MAP[c.name] ? 'hybrid' : 'base';
    const fusesFromChain = fusesAvailableFor(c.name, c.costPerFuse, inventory, depth);
    return { ...c, have, source, fusesFromInventory, fusesAvailable: fusesFromChain };
  });

  const fusesAvailable = Math.min(...components.map(c => c.fusesAvailable));
  const guaranteedDNA = fusesAvailable * 10;
  const canCreate = guaranteedDNA >= recipe.createThreshold;
  const pctToCreate = Math.min(100, Math.round((guaranteedDNA / recipe.createThreshold) * 100));
  const needsChain = components.some(c => c.source === 'hybrid' && c.have === 0);

  return { alreadyHave, canCreate, fusesAvailable, guaranteedDNA, pctToCreate, components, needsChain };
}

// Build full chain tree for display
function buildChainTree(componentName, costPerFuse, inventory, depth) {
  const have = inventory[componentName] || 0;
  const recipe = RECIPE_MAP[componentName];
  const fusesAvail = fusesAvailableFor(componentName, costPerFuse, inventory, 0);
  const node = { name: componentName, have, costPerFuse, fusesAvail, children: [], isHybrid: !!recipe };

  if (recipe && depth < 4) {
    recipe.components.forEach(c => {
      node.children.push(buildChainTree(c.name, c.costPerFuse, inventory, depth + 1));
    });
  }
  return node;
}

function renderTreeNode(node, indent) {
  const ok = node.fusesAvail > 0;
  const icon = ok ? '✓' : '✗';
  const color = ok ? '#4f4' : '#f44';
  const prefix = '&nbsp;'.repeat(indent * 4);
  const dnaInfo = node.have > 0
    ? `${node.have.toLocaleString()} DNA → ${node.fusesAvail} fuses`
    : node.isHybrid && node.fusesAvail > 0
    ? `(create first → ${node.fusesAvail} fuses)`
    : `missing`;

  let html = `<div class="chain-row" style="padding-left:${indent*14}px;${indent>0?'border-left:1px solid #0a3050;margin-left:'+(indent*6)+'px':''}">
    <span style="color:${color};flex-shrink:0">${icon}</span>
    <span style="color:${ok?'#4a9aaa':'#6a4a4a'}">${node.name}</span>
    <span style="color:#2a6080;margin-left:auto;font-size:10px;white-space:nowrap">${dnaInfo}</span>
  </div>`;

  if (node.children.length) {
    node.children.forEach(child => { html += renderTreeNode(child, indent + 1); });
  }
  return html;
}

// ── App state ─────────────────────────────────────────────────────────────────
let dnaInventory = JSON.parse(localStorage.getItem('jwa-dna') || '{}');
let apiKey = localStorage.getItem('jwa-gemini-key') || '';
let activeTab = 'owned';
let activeRarity = 'All';
let importPreview = null;

function init() {
  buildNormalizedKeys(dnaInventory);
  renderAll();
}

function saveInventory() {
  localStorage.setItem('jwa-dna', JSON.stringify(dnaInventory));
  buildNormalizedKeys(dnaInventory);
  document.getElementById('creature-count').textContent = Object.keys(dnaInventory).length;
}

function showTab(tab) {
  activeTab = tab;
  const tabs = ['owned','upgradable','close','upload','import'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i] === tab));
  tabs.forEach(t => { document.getElementById('tab-'+t).style.display = t === tab ? 'block' : 'none'; });
  document.getElementById('rarity-filter').style.display = tab === 'close' ? 'flex' : 'none';
  renderAll();
}

function setRarity(r) {
  activeRarity = r;
  document.querySelectorAll('.rarity-btn').forEach(b => {
    const br = b.dataset.rarity || 'All';
    const cfg = RARITY_CONFIG[br];
    const isActive = br === r || (r === 'All' && !b.dataset.rarity);
    b.style.borderColor = isActive ? (cfg ? cfg.color : '#4af') : '#1a3050';
    b.style.color = isActive ? (cfg ? cfg.color : '#4af') : '#4a7a9a';
    b.style.background = isActive ? (cfg ? cfg.badge : '#0a2040') : 'transparent';
  });
  renderAll();
}

function renderAll() {
  document.getElementById('creature-count').textContent = Object.keys(dnaInventory).length;
  if (activeTab === 'owned') renderOwned();
  else if (activeTab === 'upgradable') renderUpgradable();
  else if (activeTab === 'close') renderClose();
  else if (activeTab === 'upload') renderUpload();
  else if (activeTab === 'import') renderImport();
}

// ── OWNED TAB ─────────────────────────────────────────────────────────────────
function renderOwned() {
  const el = document.getElementById('tab-owned');
  const items = Object.entries(dnaInventory).sort((a,b) => a[0].localeCompare(b[0]));
  const hybrids = items.filter(([n]) => RECIPE_MAP[n]);
  const bases = items.filter(([n]) => !RECIPE_MAP[n]);

  if (items.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🦕</div><div class="empty-title">NO CREATURES YET</div><div class="empty-sub">Upload screenshots or use the Import tab</div></div>`;
    return;
  }

  const renderGrid = (list, color) => list.map(([name, dna]) => {
    const usedIn = USED_IN_MAP[name] || [];
    const usedInHtml = usedIn.length ? `<div style="font-size:9px;color:#2a5060;margin-top:2px">→ ${usedIn.slice(0,2).join(', ')}${usedIn.length>2?' +more':''}</div>` : '';
    return `<div class="inv-item" style="flex-direction:column;align-items:flex-start;border-color:${color}30">
      <div style="display:flex;justify-content:space-between;width:100%">
        <span style="font-size:11px;color:${color}">${name}</span>
        <span style="font-size:13px;font-weight:700;color:#4af;font-family:'Orbitron',sans-serif">${dna.toLocaleString()}</span>
      </div>
      ${usedInHtml}
    </div>`;
  }).join('');

  el.innerHTML = `
    ${hybrids.length > 0 ? `<div class="section-group">⚗️ HYBRIDS IN COLLECTION (${hybrids.length})</div>
    <div class="inv-grid" style="margin-bottom:16px">${renderGrid(hybrids, '#4af594')}</div>` : ''}
    ${bases.length > 0 ? `<div class="section-group">🦎 BASE CREATURES (${bases.length})</div>
    <div class="inv-grid">${renderGrid(bases, '#4a9aaa')}</div>` : ''}
  `;
}

// ── UPGRADABLE TAB ────────────────────────────────────────────────────────────
function renderUpgradable() {
  const el = document.getElementById('tab-upgradable');

  // Find owned creatures that are ingredients for hybrids not yet in collection
  const results = [];
  Object.keys(dnaInventory).forEach(creatureName => {
    const usedIn = USED_IN_MAP[creatureName] || [];
    usedIn.forEach(hybridName => {
      if (dnaInventory[hybridName]) return; // already have the hybrid
      const recipe = RECIPE_MAP[hybridName];
      if (!recipe) return;
      const ev = evaluateFusion(recipe, dnaInventory);
      // Only show if this creature specifically contributes (has DNA)
      const myComponent = ev.components.find(c => c.name === creatureName);
      if (!myComponent || myComponent.have === 0) return;
      // Avoid duplicates
      if (!results.find(r => r.recipe.name === hybridName)) {
        results.push({ recipe, ev, triggerCreature: creatureName });
      }
    });
  });

  results.sort((a,b) => b.ev.pctToCreate - a.ev.pctToCreate);

  if (results.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⬆️</div><div class="empty-title">NOTHING UPGRADABLE YET</div><div class="empty-sub">Your owned creatures aren't feeding into any available hybrids</div></div>`;
    return;
  }

  el.innerHTML = `<div class="section-group">${results.length} HYBRIDS YOUR CREATURES FEED INTO</div>` +
    results.map(({recipe, ev}) => {
      const cfg = RARITY_CONFIG[recipe.rarity];
      const canCreate = ev.canCreate;
      return `<div class="card" style="background:linear-gradient(135deg,${cfg.bg} 0%,#060f1a 100%);border:1px solid ${canCreate?cfg.color+'60':cfg.color+'25'};border-left:3px solid ${canCreate?cfg.color:cfg.color+'50'}">
        <div class="card-header">
          <div class="card-name" style="color:${cfg.color}">${recipe.name}</div>
          <div style="display:flex;gap:6px;align-items:center">
            ${canCreate ? `<span style="color:#4f4;font-size:11px;font-weight:700">READY</span>` : `<span style="font-size:12px;color:${cfg.color};font-weight:700">${ev.pctToCreate}%</span>`}
            <span class="badge" style="background:${cfg.badge};color:${cfg.color}">${recipe.rarity.toUpperCase()}</span>
          </div>
        </div>
        <div class="chain-tree">
          ${ev.components.map(c => {
            const ok = c.fusesAvailable > 0;
            const dnaInfo = c.have > 0 ? `${c.have.toLocaleString()} → ${c.fusesAvailable} fuses @ ${c.costPerFuse}/fuse`
              : c.source === 'hybrid' ? `(create first)` : `missing`;
            return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0a2030;font-size:11px">
              <span style="color:${ok?'#4a9aaa':'#6a4a4a'}">${ok?'✓':'✗'} ${c.name}</span>
              <span style="color:#2a6080;font-size:10px">${dnaInfo}</span>
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:10px;color:#2a6080;margin-top:6px">${ev.fusesAvailable} fuses possible → ${ev.guaranteedDNA} DNA guaranteed · need ${recipe.createThreshold}</div>
      </div>`;
    }).join('');
}

// ── CLOSE TAB — full chain tree display ───────────────────────────────────────
function renderClose() {
  const filtered = FUSION_RECIPES.filter(r => activeRarity === 'All' || r.rarity === activeRarity);
  const evaluated = filtered
    .map(r => ({ recipe: r, ev: evaluateFusion(r, dnaInventory) }))
    .filter(({ev}) => !ev.alreadyHave && ev.pctToCreate >= 10)
    .sort((a,b) => b.ev.pctToCreate - a.ev.pctToCreate);

  const el = document.getElementById('tab-close');

  if (evaluated.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">NOTHING IN RANGE YET</div><div class="empty-sub">Add DNA to see what you're close to creating</div></div>`;
    return;
  }

  const ready = evaluated.filter(({ev}) => ev.canCreate);
  const close = evaluated.filter(({ev}) => !ev.canCreate);

  let html = '';

  if (ready.length > 0) {
    html += `<div class="section-group">✅ GUARANTEED CREATABLE NOW (${ready.length})</div>`;
    html += ready.map(({recipe, ev}) => renderCloseCard(recipe, ev)).join('');
  }

  if (close.length > 0) {
    html += `<div class="section-group">⚡ IN PROGRESS (${close.length})</div>`;
    html += close.map(({recipe, ev}) => renderCloseCard(recipe, ev)).join('');
  }

  el.innerHTML = html;
}

function renderCloseCard(recipe, ev) {
  const cfg = RARITY_CONFIG[recipe.rarity];

  // Build full chain trees for each component
  const treeHtml = recipe.components.map(c => {
    const tree = buildChainTree(c.name, c.costPerFuse, dnaInventory, 0);
    return renderTreeNode(tree, 0);
  }).join('<div style="height:1px;background:#0a2030;margin:4px 0"></div>');

  return `<div class="card" style="background:linear-gradient(135deg,${cfg.bg} 0%,#060f1a 100%);border:1px solid ${cfg.color}30;border-left:3px solid ${ev.canCreate?cfg.color:cfg.color+'60'}">
    <div class="card-header">
      <div class="card-name" style="color:${cfg.color}">${recipe.name}</div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:12px;color:${ev.canCreate?'#4f4':cfg.color};font-weight:700">${ev.canCreate?'✅ READY':ev.pctToCreate+'%'}</span>
        <span class="badge" style="background:${cfg.badge};color:${cfg.color}">${recipe.rarity.toUpperCase()}</span>
      </div>
    </div>
    <div class="chain-tree">${treeHtml}</div>
    <div style="font-size:10px;color:#2a6080;margin-top:6px">
      ${ev.fusesAvailable} fuses possible → ${ev.guaranteedDNA} DNA guaranteed · need ${recipe.createThreshold} to unlock
      ${ev.needsChain ? ' · ⛓ requires creating intermediate hybrid first' : ''}
    </div>
  </div>`;
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem('jwa-gemini-key', val);
  if (activeTab === 'upload') renderUpload();
}

function clearApiKey() {
  apiKey = '';
  localStorage.removeItem('jwa-gemini-key');
  renderUpload();
}

async function testApiKey() {
  const result = document.getElementById('api-test-result');
  if (!apiKey) { result.innerHTML = '<span style="color:#f44">No API key saved</span>'; return; }
  result.innerHTML = '<span style="color:#4a8aaa">Testing...</span>';
  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:'Reply with just the word WORKING'}]}]})
    });
    const data = await resp.json();
    if (data.error) { result.innerHTML = `<span style="color:#f44">ERROR: ${data.error.message}</span>`; }
    else {
      const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || 'no response';
      result.innerHTML = `<span style="color:#4f4">✓ API works! Response: ${txt.slice(0,50)}</span>`;
    }
  } catch(e) { result.innerHTML = `<span style="color:#f44">FAILED: ${e.message}</span>`; }
}

function handleDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); }
function handleDragLeave() { document.getElementById('drop-zone').classList.remove('drag-over'); }
function handleDrop(e) { e.preventDefault(); document.getElementById('drop-zone').classList.remove('drag-over'); processFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'))); }
function handleFileInput(e) { processFiles([...e.target.files]); e.target.value=''; }

async function processFiles(files) {
  if (!apiKey) { alert('Please save your Gemini API key first.'); return; }
  if (!files.length) return;
  window._lastGeminiText = null;
  const prog = document.getElementById('upload-progress');
  const bar = document.getElementById('progress-bar');
  const txt = document.getElementById('progress-text');
  const eta = document.getElementById('progress-eta');
  const cur = document.getElementById('progress-current');
  const log = document.getElementById('progress-log');
  const res = document.getElementById('upload-results');
  if (!prog) { alert('Page not ready. Please refresh.'); return; }
  prog.style.display='block'; res.innerHTML=''; log.innerHTML='';
  const allParsed=[], logEntries=[];

  for (let i=0; i<files.length; i++) {
    const pct = Math.round((i/files.length)*100);
    bar.style.width = pct+'%';
    txt.textContent = `${i+1} / ${files.length}`;
    cur.textContent = files[i].name;
    const remaining = (files.length - i) * 18;
    eta.textContent = `~${remaining}s remaining`;

    if (i > 0) {
      // Countdown display between images
      for (let s=10; s>0; s--) {
        eta.textContent = `next image in ${s}s...`;
        await new Promise(r=>setTimeout(r,1000));
      }
    }

    let parsed=[], status='ok', errMsg='';
    try {
      parsed = await parseWithGemini(files[i]);
      if (!parsed.length) status='empty';
    } catch(e) {
      if (e.message && e.message.includes('429')) {
        eta.textContent = 'Rate limited — waiting 20s...';
        for (let s=20; s>0; s--) {
          eta.textContent = `Rate limited — retrying in ${s}s...`;
          await new Promise(r=>setTimeout(r,1000));
        }
        try { parsed = await parseWithGemini(files[i]); if(!parsed.length) status='empty'; }
        catch(e2) { status='error'; errMsg=e2.message; }
      } else { status='error'; errMsg=e.message; }
    }

    logEntries.push({name:files[i].name, count:parsed.length, status, errMsg});
    allParsed.push(...parsed);

    if (parsed.length) {
      parsed.forEach(({name,dna}) => {
        if (name && dna >= 0) dnaInventory[name] = dna;
      });
      saveInventory();
    }

    // Update live log
    const color = status==='ok'?'#4f4':status==='empty'?'#fa4':'#f44';
    const label = status==='ok'?`+${parsed.length} creatures`:status==='empty'?'no data found':'error: '+errMsg;
    log.innerHTML += `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #0a2020">
      <span style="color:#4a7a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">${files[i].name}</span>
      <span style="color:${color};font-weight:700">${label}</span>
    </div>`;
    log.scrollTop = log.scrollHeight;
  }

  bar.style.width='100%';
  txt.textContent=`${files.length} / ${files.length}`;
  cur.textContent='';
  eta.textContent='✅ Complete!';

  const ok = allParsed.length > 0;
  res.innerHTML = `<div class="result-box" style="background:${ok?'#0a2010':'#200a0a'};border:1px solid ${ok?'#2a6020':'#602020'}">
    <div style="font-family:'Orbitron',sans-serif;font-size:13px;color:${ok?'#4f4':'#f44'};text-align:center;padding:8px 0">
      ${ok ? `✓ ${allParsed.length} CREATURES UPDATED` : '✗ NO DATA DETECTED'}
    </div>
    ${!ok ? `<div style="font-size:11px;color:#6a4040;text-align:center;margin-top:4px">Check your API key and try again</div>` : ''}
  </div>`;

  renderAll();
}

async function parseWithGemini(file) {
  const b64 = await new Promise((res,rej) => {
    const r = new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file);
  });
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{parts:[
        {inline_data:{mime_type:file.type||'image/jpeg',data:b64}},
        {text:`This is a Jurassic World Alive creature collection screenshot. Each creature card shows the creature name at the bottom and DNA in format CURRENT/MAX (e.g. 14925/1000). Extract ONLY the CURRENT (first) number.\n\nReturn ONLY a valid JSON array, no markdown, no explanation:\n[{"name":"Creature Name","dna":1234},...]\n\nRules:\n- Use proper title case (e.g. "Tyrannosaurus Rex Gen 2" not "TYRANNOSAURUS REX GEN 2")\n- If DNA shows 250000+ treat as 250000\n- Include ALL visible creatures\n- Return [] if no creatures visible`}
      ]}],
      generationConfig:{temperature:0}
    })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  if (!data.candidates?.length) throw new Error('No response from API');
  const t = data.candidates[0]?.content?.parts?.[0]?.text || '[]';
  window._lastGeminiText = t;
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

function renderImport() {
  document.getElementById('tab-import').innerHTML = `
    <div class="info-box" style="margin-top:0;margin-bottom:14px">
      <div class="info-box-title">HOW TO USE</div>
      Share screenshots in Claude chat → Claude reads them → paste the list below → Import.<br>
      Format: <span style="color:#4af;font-family:monospace">Therizinosaurus: 14925</span>
    </div>
    <textarea style="width:100%;height:200px;font-family:monospace;font-size:13px;line-height:1.6;resize:vertical;margin-bottom:10px;background:#080f1a;border:1px solid #0a3050;border-radius:8px;color:#c8e6ff;padding:10px;outline:none" id="import-text" placeholder="Paste DNA list here...&#10;&#10;Therizinosaurus: 14925&#10;Wuerhosaurus: 66826"></textarea>
    <div class="flex-row" style="margin-bottom:14px">
      <button class="btn-primary" onclick="previewImport()" style="flex:1">PREVIEW</button>
      <button id="import-btn" class="btn-disabled" onclick="confirmImport()" style="flex:1">IMPORT ALL</button>
    </div>
    <div id="import-results"></div>`;
}

function previewImport() {
  const lines = document.getElementById('import-text').value.split('\n').map(l=>l.trim()).filter(Boolean);
  importPreview = [];
  for (const line of lines) {
    const m = line.match(/^(.+?)[\s:,]+(\d[\d,]+)\s*$/);
    if (m) importPreview.push({name:m[1].trim(), dna:parseInt(m[2].replace(/,/g,''))});
  }
  const btn = document.getElementById('import-btn');
  const res = document.getElementById('import-results');
  if (!importPreview.length) { btn.className='btn-disabled'; res.innerHTML=`<div style="color:#f44;font-size:12px;padding:10px">No valid entries. Format: Creature Name: 1234</div>`; return; }
  btn.className='btn-success';
  res.innerHTML=`<div style="background:#080f1a;border:1px solid #0a3050;border-radius:8px;padding:14px">
    <div style="font-family:'Orbitron',sans-serif;font-size:11px;color:#4a8aaa;margin-bottom:10px;letter-spacing:1px">PREVIEW — ${importPreview.length} ENTRIES</div>
    <div style="max-height:300px;overflow-y:auto">${importPreview.map(e=>`<div class="result-row"><span style="color:#4a9aaa">${e.name}</span><span style="color:#4af;font-weight:700">${e.dna.toLocaleString()}</span></div>`).join('')}</div>
  </div>`;
}

function confirmImport() {
  if (!importPreview||!importPreview.length) return;
  importPreview.forEach(({name,dna}) => { dnaInventory[name]=dna; });
  saveInventory();
  document.getElementById('import-results').innerHTML=`<div style="background:#0a2010;border:1px solid #2a6020;border-radius:8px;padding:12px;color:#4f4;font-family:'Orbitron',sans-serif;font-size:12px;text-align:center">✓ ${importPreview.length} ENTRIES SAVED</div>`;
  document.getElementById('import-btn').className='btn-disabled';
  importPreview=null; renderAll();
}

showTab('owned');
