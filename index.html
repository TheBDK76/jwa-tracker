<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWA DNA Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050d14;color:#c8e6ff;font-family:'Rajdhani',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,80,160,.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(80,0,160,.1) 0%,transparent 50%);pointer-events:none}
.header{background:linear-gradient(135deg,#061828 0%,#0a1f35 50%,#061828 100%);border-bottom:2px solid #0a4060;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 30px rgba(0,120,255,.15);position:sticky;top:0;z-index:10}
.header-icon{font-size:28px}
.header-title{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:#4af;letter-spacing:3px}
.header-sub{font-size:10px;color:#4a8aaa;letter-spacing:2px}
.header-bdk{font-size:10px;color:#fff;letter-spacing:1px;margin-top:2px;font-weight:600}
.header-right{margin-left:auto;text-align:right}
.header-count-num{font-size:20px;font-weight:700;color:#4af;font-family:'Orbitron',sans-serif}
.header-count-label{font-size:9px;color:#4a8aaa;letter-spacing:1px}
.bdk-banner{background:#0a0a0a;border-bottom:1px solid #222;padding:5px 0;text-align:center;font-size:11px;color:#fff;letter-spacing:2px;font-weight:600}
.tabs{display:flex;border-bottom:1px solid #0a3050;background:#040e1a;position:sticky;top:88px;z-index:9}
.tab{flex:1;padding:9px 2px;border:none;cursor:pointer;background:transparent;color:#4a7a9a;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{background:#0a2040;color:#4af;border-bottom-color:#4af}
.rarity-filter{display:flex;gap:5px;padding:8px 12px;background:#040e1a;border-bottom:1px solid #0a2030;flex-wrap:wrap}
.rarity-btn{padding:3px 9px;border-radius:20px;border:1px solid #1a3050;background:transparent;color:#4a7a9a;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.5px;font-family:'Rajdhani',sans-serif;transition:all .2s}
.content{padding:12px;max-width:900px;margin:0 auto}
.empty-state{text-align:center;padding:50px 20px;color:#2a5070}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-title{font-family:'Orbitron',sans-serif;font-size:12px}
.empty-sub{font-size:12px;margin-top:6px;color:#1a3040}
.card{border-radius:8px;padding:11px 13px;margin-bottom:9px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.card-name{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700}
.badge{padding:2px 7px;border-radius:12px;font-size:9px;font-weight:700;letter-spacing:.5px}
.section-group{font-family:'Orbitron',sans-serif;font-size:9px;color:#2a6080;letter-spacing:2px;padding:5px 0 3px;border-bottom:1px solid #0a2030;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.section-group:hover{color:#4a8aaa}
.chain-tree{margin-top:7px;padding:7px;background:#040e14;border-radius:6px;font-size:11px}
.chain-row{padding:2px 0;display:flex;align-items:flex-start;gap:5px}
input,textarea{background:#080f1a;border:1px solid #0a3050;border-radius:8px;color:#c8e6ff;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;padding:8px 11px;width:100%}
input::placeholder,textarea::placeholder{color:#2a5070}
button{cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:700;border-radius:8px;border:none;transition:all .2s}
.btn-primary{background:#0a3060;border:1px solid #4af;color:#4af;padding:9px 16px;font-size:10px;letter-spacing:1px}
.btn-success{background:#0a3020;border:1px solid #4f4;color:#4f4;padding:9px 16px;font-size:10px;letter-spacing:1px}
.btn-warn{background:#1a0a0a;border:1px solid #e84545;color:#e84545;padding:9px 16px;font-size:10px;letter-spacing:1px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.modal-box{background:#061828;border:2px solid #4af;border-radius:16px;padding:30px 24px;text-align:center;max-width:320px;width:100%}
.modal-title{font-family:'Orbitron',sans-serif;font-size:13px;color:#4af;letter-spacing:2px;margin-bottom:16px}
.modal-timer{font-family:'Orbitron',sans-serif;font-size:48px;color:#4af;font-weight:900;margin:10px 0}
.modal-sub{font-size:12px;color:#4a8aaa;margin-top:8px}
.sort-bar{display:flex;gap:5px;padding:8px 12px;background:#040e1a;border-bottom:1px solid #0a2030;flex-wrap:wrap;align-items:center}
.sort-btn{padding:3px 9px;border-radius:20px;border:1px solid #1a3050;background:transparent;color:#4a7a9a;cursor:pointer;font-size:11px;font-weight:600;font-family:'Rajdhani',sans-serif;transition:all .2s}
.sort-btn.active{border-color:#4af;color:#4af;background:#0a2040}
.owned-row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #0a1a28;gap:8px}
.owned-row:last-child{border-bottom:none}
.owned-level{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:#fff;background:#1a3050;border-radius:4px;padding:2px 5px;min-width:28px;text-align:center;flex-shrink:0}
.owned-name{flex:1;font-size:12px;font-weight:600}
.owned-rarity{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
.owned-dna{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:#4af;flex-shrink:0;min-width:60px;text-align:right}
.info-box{background:#060f1a;border:1px solid #0a2535;border-radius:10px;padding:12px 14px;font-size:12px;color:#2a6080;line-height:1.7;margin-top:14px}
.info-box-title{color:#4a8aaa;font-weight:700;margin-bottom:5px;letter-spacing:1px;font-size:10px;font-family:'Orbitron',sans-serif}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}
.inv-item{background:#080f1a;border:1px solid #0a2535;border-radius:8px;padding:7px 11px;display:flex;flex-direction:column}
.drop-zone{border:2px dashed #0a4060;border-radius:12px;padding:32px 20px;text-align:center;background:#040e1a;margin-bottom:14px;transition:all .2s}
.drop-zone.drag-over{border-color:#4af;background:#0a1f30}
.result-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0a2020;font-size:12px}
.flex-row{display:flex;gap:7px}
.api-box{background:#040e1a;border:1px solid #0a3050;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.api-label{font-family:'Orbitron',sans-serif;font-size:10px;color:#4a8aaa;letter-spacing:1px;margin-bottom:8px}
.update-bar{background:#040e1a;border:1px solid #0a3050;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.update-status{color:#2a6080}
.update-status.ok{color:#4f4}
.update-status.loading{color:#4a8aaa}
.update-status.error{color:#e84545}
</style>
</head>

<div class="header">
  <div class="header-icon">🦕</div>
  <div>
    <div class="header-title">JWA DNA Tracker</div>
    <div class="header-sub">JURASSIC WORLD ALIVE · COMPANION · v0.1.5</div>
    <div class="header-bdk">Brought to you by The BDK</div>
  </div>
  <div class="header-right">
    <div class="header-count-num" id="creature-count">0</div>
    <div class="header-count-label">TRACKED</div>
  </div>
</div>

<div class="bdk-banner">✦ BROUGHT TO YOU BY THE BDK ✦</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('owned')">🦕 Owned</button>
  <button class="tab" onclick="showTab('upgradable')">⬆ Upgradable</button>
  <button class="tab" onclick="showTab('close')">⚡ Close</button>
  <button class="tab" onclick="showTab('upload')">📸 Upload</button>
  <button class="tab" onclick="showTab('import')">📋 Import</button>
</div>

<div id="rarity-filter" class="rarity-filter" style="display:none"></div>

<div class="content">
  <div id="tab-owned"></div>

  <div id="tab-close" style="display:none"></div>

  <div id="tab-import" style="display:none"></div>
</div>

let apiKey       = localStorage.getItem('jwa-gemini-key') || '';
let activeTab    = 'owned';
let activeRarity = 'All';
let collapsed    = JSON.parse(localStorage.getItem('jwa-collapsed') || '{}');

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─────────────────────────────────────────────────────────────────────────────
// INDEXES — built from creatureDB for fast lookup
// ─────────────────────────────────────────────────────────────────────────────
let HYBRIDS = {};   // {name: creatureData} — only hybrids
let USED_IN = {};   // {componentName: [hybridName, ...]}

function buildIndexes() {
  HYBRIDS = {};
  USED_IN = {};
  Object.entries(creatureDB).forEach(([name, data]) => {
    if (data.isHybrid && data.components?.length) {
      HYBRIDS[name] = data;
      data.components.forEach(c => {
        if (!USED_IN[c.name]) USED_IN[c.name] = [];
        if (!USED_IN[c.name].includes(name)) USED_IN[c.name].push(name);
      });
    }
  });
}

function getThreshold(rarity) {
  return (RARITY_CONFIG[rarity] || {threshold:200}).threshold;
}

// ─────────────────────────────────────────────────────────────────────────────
// FUSION ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function fusesAvailable(compName, costPerFuse, depth) {
  if (depth > 6 || costPerFuse <= 0) return 0;
  const have = dnaInventory[compName] || 0;
  if (have > 0) return Math.floor(have / costPerFuse);
  const recipe = HYBRIDS[compName];
  if (!recipe) return 0;
  const ev = evaluateFusion(recipe, depth + 1);
  return ev.canCreate ? Math.floor(getThreshold(recipe.rarity) / costPerFuse) : 0;
}

function evaluateFusion(data, depth = 0) {
  const threshold  = getThreshold(data.rarity);
  const alreadyHave = (dnaInventory[data.name] || 0) > 0;
  const components = (data.components || []).map(c => {
    const have = dnaInventory[c.name] || 0;
    const fuses = fusesAvailable(c.name, c.costPerFuse, depth);
    return {...c, have, fusesAvailable: fuses};
  });
  const fuses = components.length ? Math.min(...components.map(c => c.fusesAvailable)) : 0;
  const dnaGuaranteed = fuses * 10;
  const canCreate = dnaGuaranteed >= threshold;
  const pct = Math.min(100, Math.round((dnaGuaranteed / threshold) * 100));
  return {alreadyHave, canCreate, fusesAvailable: fuses, dnaGuaranteed, pct, components, threshold};
}

function buildChainTree(compName, costPerFuse, depth) {
  const have   = dnaInventory[compName] || 0;
  const recipe = HYBRIDS[compName];
  const fuses  = fusesAvailable(compName, costPerFuse, 0);
  const node   = {name:compName, have, costPerFuse, fuses, children:[], isHybrid:!!recipe};
  if (recipe && depth < 4) {
    (recipe.components||[]).forEach(c => node.children.push(buildChainTree(c.name, c.costPerFuse, depth+1)));
  }
  return node;
}

function renderTreeNode(node, indent) {
  const ok    = node.fuses > 0;
  const color = ok ? '#4f4' : '#f44';
  const info  = node.have > 0
    ? `${node.have.toLocaleString()} DNA → ${node.fuses} fuses`
    : node.isHybrid && node.fuses > 0 ? '(create first)' : 'missing';
  let html = `<div class="chain-row" style="padding-left:${indent*13}px">
    <span style="color:${color};flex-shrink:0">${ok?'✓':'✗'}</span>
    <span style="color:${ok?'#4a9aaa':'#6a4a4a'}">${node.name}</span>
    <span style="color:#2a6080;margin-left:auto;font-size:10px;white-space:nowrap">${info}</span>
  </div>`;
  node.children.forEach(ch => { html += renderTreeNode(ch, indent+1); });
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function saveInventory() {
  localStorage.setItem('jwa-dna', JSON.stringify(dnaInventory));
  document.getElementById('creature-count').textContent = Object.keys(dnaInventory).length;
}

function toggleSection(key) {
  collapsed[key] = !collapsed[key];
  localStorage.setItem('jwa-collapsed', JSON.stringify(collapsed));
  renderAll();
}

function showTab(tab) {
  activeTab = tab;
  const tabs = ['owned','upgradable','close','upload','import'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i] === tab));
  tabs.forEach(t => { document.getElementById('tab-'+t).style.display = t===tab?'block':'none'; });
  const showFilter = tab==='close'||tab==='upgradable';
  document.getElementById('rarity-filter').style.display = showFilter?'flex':'none';
  if (showFilter) renderRarityFilter();
  renderAll();
}

function renderRarityFilter() {
  const rarities = ['All',...RARITY_ORDER];
  document.getElementById('rarity-filter').innerHTML = rarities.map(r => {
    const cfg = RARITY_CONFIG[r];
    const active = r === activeRarity;
    return `<button class="rarity-btn" data-rarity="${r}" onclick="setRarity('${r}')"
      style="border-color:${active?(cfg?cfg.color:'#4af'):'#1a3050'};color:${active?(cfg?cfg.color:'#4af'):'#4a7a9a'};background:${active?(cfg?cfg.badge:'#0a2040'):'transparent'}">${r}</button>`;
  }).join('');
}

function setRarity(r) {
  activeRarity = r;
  renderRarityFilter();
  renderAll();
}

function renderAll() {
  document.getElementById('creature-count').textContent = Object.keys(dnaInventory).length;
  if      (activeTab==='owned')     renderOwned();
  else if (activeTab==='upgradable')renderUpgradable();
  else if (activeTab==='close')     renderClose();
  else if (activeTab==='upload')    renderUpload();
  else if (activeTab==='import')    renderImport();
}

// ─────────────────────────────────────────────────────────────────────────────
// UPDATE STATUS BAR — shown in owned tab
// ─────────────────────────────────────────────────────────────────────────────
function updateBarHTML() {
  const count = Object.keys(creatureDB).length;
  return `<div class="update-bar">
    <span class="update-status ${count>0?'ok':'error'}">
      ${count>0 ? `✓ ${count} creatures · db: ${DB_UPDATED}` : '⚠ No creature data yet'}
    </span>
    <span style="color:#1a4060;font-size:10px">auto-updates on the 15th</span>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// OWNED TAB
// ─────────────────────────────────────────────────────────────────────────────
let ownedSort = 'rarity'; // default sort
let ownedSortDir = 'desc';

function renderOwned() {
  const el = document.getElementById('tab-owned');
  const items = Object.entries(dnaInventory);

  if (!items.length) {
    el.innerHTML = updateBarHTML() + `<div class="empty-state"><div class="empty-icon">🦕</div>
      <div class="empty-title">NO CREATURES YET</div>
      <div class="empty-sub">Upload screenshots or use the Import tab</div></div>`;
    return;
  }

  // Apply sort
  items.sort((a,b) => {
    const aData = dnaInventory[a[0]];
    const bData = dnaInventory[b[0]];
    const aLevel = (typeof aData === 'object' ? aData.level : null) || 0;
    const bLevel = (typeof bData === 'object' ? bData.level : null) || 0;
    const aDna   = getDna(aData);
    const bDna   = getDna(bData);
    const aRarity = RARITY_ORDER.indexOf(creatureDB[a[0]]?.rarity || 'Common');
    const bRarity = RARITY_ORDER.indexOf(creatureDB[b[0]]?.rarity || 'Common');
    let cmp = 0;
    if (ownedSort === 'name')   cmp = a[0].localeCompare(b[0]);
    if (ownedSort === 'level')  cmp = aLevel - bLevel;
    if (ownedSort === 'rarity') cmp = aRarity - bRarity;
    if (ownedSort === 'dna')    cmp = aDna - bDna;
    return ownedSortDir === 'desc' ? -cmp : cmp;
  });

  const sortBar = `<div class="sort-bar">
    <span style="font-size:10px;color:#2a6080;font-family:'Orbitron',sans-serif;letter-spacing:1px">SORT:</span>
    ${['name','level','rarity','dna'].map(s => `
      <button class="sort-btn ${ownedSort===s?'active':''}" onclick="setOwnedSort('${s}')">
        ${s.toUpperCase()}${ownedSort===s ? (ownedSortDir==='desc'?' ▼':' ▲') : ''}
      </button>`).join('')}
  </div>`;

  const rows = items.map(([name, rawData]) => {
    const dna    = getDna(rawData);
    const level  = getLevel(rawData);
    const rarity = getRarity(name, rawData);
    const data   = creatureDB[name];
    const cfg    = RARITY_CONFIG[rarity] || {};
    const color  = cfg.color || '#4a9aaa';
    const usedIn = USED_IN[name] || [];
    const usedHtml = usedIn.length ? `<div style="font-size:9px;color:#1a4060;margin-top:1px">→ ${usedIn.slice(0,2).join(', ')}${usedIn.length>2?` +${usedIn.length-2}`:''}</div>` : '';
    return `<div class="owned-row">
      <div class="owned-level">Lv.${level}</div>
      <div style="flex:1">
        <div class="owned-name" style="color:${color}">${name}</div>
        ${usedHtml}
      </div>
      <div class="owned-rarity" style="background:${cfg.badge||'#1a3050'};color:${color}">${rarity}</div>
      <div class="owned-dna">${dna.toLocaleString()}</div>
    </div>`;
  }).join('');

  el.innerHTML = updateBarHTML() + sortBar +
    `<div style="background:#060f1a;border:1px solid #0a2535;border-radius:10px;overflow:hidden;margin-top:10px">
      <div style="display:flex;padding:5px 10px;border-bottom:1px solid #0a2030;font-size:9px;color:#2a5070;font-family:'Orbitron',sans-serif;letter-spacing:1px">
        <span style="min-width:36px">LVL</span>
        <span style="flex:1">NAME</span>
        <span style="margin-right:8px">RARITY</span>
        <span style="min-width:60px;text-align:right">DNA</span>
      </div>
      ${rows}
    </div>
    <div style="font-size:11px;color:#1a4060;text-align:center;padding:8px">${items.length} creatures tracked</div>`;
}

function setOwnedSort(s) {
  if (ownedSort === s) ownedSortDir = ownedSortDir === 'desc' ? 'asc' : 'desc';
  else { ownedSort = s; ownedSortDir = 'desc'; }
  renderOwned();
}

// ─────────────────────────────────────────────────────────────────────────────
// UPGRADABLE TAB
// ─────────────────────────────────────────────────────────────────────────────
function renderUpgradable() {
  const el = document.getElementById('tab-upgradable');
  const results = [];

  Object.entries(HYBRIDS).forEach(([name, data]) => {
    if (dnaInventory[name]) return; // already have it
    if (activeRarity !== 'All' && data.rarity !== activeRarity) return;
    const ev = evaluateFusion(data);
    // All components must be owned AND 75%+ progress
    const allOwned = ev.components.every(c => (dnaInventory[c.name]||0) > 0);
    if (!allOwned || ev.pct < 75) return;
    results.push({name, data, ev});
  });

  results.sort((a,b) => b.ev.pct - a.ev.pct);

  if (!results.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⬆️</div>
      <div class="empty-title">NOTHING UPGRADABLE YET</div>
      <div class="empty-sub">Need all components owned + 75% DNA progress</div></div>`;
    return;
  }

  el.innerHTML = `<div class="section-group">${results.length} HYBRIDS READY TO PUSH</div>` +
    results.map(({name, data, ev}) => {
      const cfg = RARITY_CONFIG[data.rarity] || {};
      return `<div class="card" style="background:linear-gradient(135deg,${cfg.bg} 0%,#060f1a 100%);border:1px solid ${ev.canCreate?cfg.color+'60':cfg.color+'25'};border-left:3px solid ${ev.canCreate?cfg.color:cfg.color+'50'}">
        <div class="card-header">
          <div class="card-name" style="color:${cfg.color}">${name}</div>
          <div style="display:flex;gap:5px;align-items:center">
            ${ev.canCreate?`<span style="color:#4f4;font-size:11px;font-weight:700">READY</span>`:`<span style="font-size:12px;color:${cfg.color};font-weight:700">${ev.pct}%</span>`}
            <span class="badge" style="background:${cfg.badge};color:${cfg.color}">${data.rarity.toUpperCase()}</span>
          </div>
        </div>
        <div class="chain-tree">${ev.components.map(c=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0a2030;font-size:11px">
            <span style="color:${c.fusesAvailable>0?'#4a9aaa':'#6a4a4a'}">${c.fusesAvailable>0?'✓':'✗'} ${c.name}</span>
            <span style="color:#2a6080;font-size:10px">${c.have.toLocaleString()} → ${c.fusesAvailable} fuses</span>
          </div>`).join('')}</div>
        <div style="font-size:10px;color:#2a6080;margin-top:5px">${ev.fusesAvailable} fuses → ${ev.dnaGuaranteed} DNA · need ${ev.threshold}</div>
      </div>`;
    }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// CLOSE TAB
// ─────────────────────────────────────────────────────────────────────────────
function renderClose() {
  const el = document.getElementById('tab-close');
  const evaluated = Object.entries(HYBRIDS)
    .filter(([,d]) => activeRarity==='All' || d.rarity===activeRarity)
    .map(([name,data]) => ({name, data, ev:evaluateFusion(data)}))
    .filter(({ev}) => !ev.alreadyHave && ev.pct >= 10)
    .sort((a,b) => b.ev.pct - a.ev.pct);

  if (!evaluated.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚡</div>
      <div class="empty-title">NOTHING IN RANGE</div>
      <div class="empty-sub">Add DNA to see what you're close to creating</div></div>`;
    return;
  }

  const ready = evaluated.filter(({ev}) => ev.canCreate);
  const close = evaluated.filter(({ev}) => !ev.canCreate);
  let html = '';

  const renderSection = (list, label) => {
    if (!list.length) return '';
    let s = `<div class="section-group">${label} (${list.length})</div>`;
    [...RARITY_ORDER].reverse().forEach(rarity => {
      const group = list.filter(({data}) => data.rarity === rarity);
      if (!group.length) return;
      const cfg = RARITY_CONFIG[rarity] || {};
      const key = `close-${label}-${rarity}`;
      s += `<div class="section-group" onclick="toggleSection('${key}')" style="color:${cfg.color};padding-left:8px">
        ${rarity} (${group.length}) <span>${collapsed[key]?'▼':'▲'}</span>
      </div>`;
      if (!collapsed[key]) s += group.map(({name,data,ev}) => renderCloseCard(name,data,ev)).join('');
    });
    return s;
  };

  html += renderSection(ready, '✅ READY TO CREATE');
  html += renderSection(close, '⚡ IN PROGRESS');
  el.innerHTML = html;
}

function renderCloseCard(name, data, ev) {
  const cfg = RARITY_CONFIG[data.rarity] || {};
  const tree = (data.components||[]).map(c => renderTreeNode(buildChainTree(c.name, c.costPerFuse, 0), 0)).join('<div style="height:1px;background:#0a2030;margin:3px 0"></div>');
  return `<div class="card" style="background:linear-gradient(135deg,${cfg.bg} 0%,#060f1a 100%);border:1px solid ${cfg.color}30;border-left:3px solid ${ev.canCreate?cfg.color:cfg.color+'60'}">
    <div class="card-header">
      <div class="card-name" style="color:${cfg.color}">${name}</div>
      <div style="display:flex;gap:5px;align-items:center">
        <span style="font-size:12px;color:${ev.canCreate?'#4f4':cfg.color};font-weight:700">${ev.canCreate?'✅ READY':ev.pct+'%'}</span>
        <span class="badge" style="background:${cfg.badge};color:${cfg.color}">${data.rarity.toUpperCase()}</span>
      </div>
    </div>
    <div class="chain-tree">${tree}</div>
    <div style="font-size:10px;color:#2a6080;margin-top:5px">${ev.fusesAvailable} fuses → ${ev.dnaGuaranteed} DNA · need ${ev.threshold}</div>
  </div>`;
}

  if (saved) apiKey = saved;
  document.getElementById('tab-upload').innerHTML = `
    <div class="api-box">
      <div class="api-label">GEMINI API KEY</div>
      ${saved ? `<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
          <div style="flex:1;background:#080f1a;border:1px solid #4f4;border-radius:8px;padding:8px 11px;font-family:monospace;font-size:12px;color:#4f4;letter-spacing:3px">●●●●●●●●●●●● ✓ SAVED</div>
          <button class="btn-primary" onclick="clearApiKey()" style="padding:8px 12px;font-size:9px">CHANGE</button>
        </div>`
        : `<div class="flex-row" style="margin-bottom:7px">
          <input type="password" id="api-key-input" placeholder="Paste your Gemini API key...">
          <button class="btn-success" onclick="saveApiKey()" style="white-space:nowrap">SAVE</button>
        </div>`}
      <div style="font-size:11px;color:#1a4060">Free from aistudio.google.com · Stored locally only</div>
      <button class="btn-primary" style="margin-top:9px;width:100%" onclick="testApiKey()">TEST KEY</button>

    </div>
    <div class="drop-zone" id="drop-zone"
      ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
      <div style="font-size:36px;margin-bottom:8px">📸</div>
      <div style="font-family:'Orbitron',sans-serif;font-size:12px;color:#4af;margin-bottom:6px">DROP SCREENSHOTS HERE</div>

      <button class="btn-primary" onclick="${saved?`document.getElementById('file-input').click()`:'alert(\"Save your API key first\")'}" style="${saved?'':'opacity:.4'}">SELECT FILES</button>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">

    <div id="upload-progress"></div>

}

function saveApiKey() {
  const v = document.getElementById('api-key-input')?.value?.trim();
  if (!v) return;
  apiKey = v;
  localStorage.setItem('jwa-gemini-key', v);
  renderUpload();
}
function clearApiKey() { apiKey=''; localStorage.removeItem('jwa-gemini-key'); renderUpload(); }
async function testApiKey() {
  const el = document.getElementById('api-test-result');
  if (!apiKey) { el.innerHTML = '<span style="color:#f44">No API key saved.</span>'; return; }
  el.innerHTML = '<span style="color:#4a8aaa">Testing...</span>';
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Say OK'}]}]})});
    const d = await r.json();
    el.innerHTML = d.candidates ? '<span style="color:#4f4">✓ API key works!</span>' : `<span style="color:#f44">Error: ${d.error?.message||'Unknown'}</span>`;
  } catch(e) { el.innerHTML = `<span style="color:#f44">Error: ${e.message}</span>`; }
}

function handleDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); }
function handleDragLeave()  { document.getElementById('drop-zone').classList.remove('drag-over'); }
function handleDrop(e) { e.preventDefault(); document.getElementById('drop-zone').classList.remove('drag-over'); handleFiles(e.dataTransfer.files); }

async function handleFiles(files) {
  if (!apiKey) { alert('Please save your Gemini API key first.'); return; }
  if (!files.length) return;

  // Wake Lock — prevent screen sleep where supported
  let wakeLock = null;
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e) {}

  // Modal overlay to prevent navigation
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'upload-modal';
  modal.innerHTML = `<div class="modal-box">
    <div class="modal-title">UPLOADING</div>
    <div id="modal-file-status" style="font-size:11px;color:#4a8aaa;margin-bottom:10px">Preparing...</div>
    <div class="modal-timer" id="modal-timer"></div>
    <div class="modal-sub" id="modal-sub"></div>
  </div>`;
  document.body.appendChild(modal);

  const setModal = (fileStatus, timer, sub) => {
    const fs = document.getElementById('modal-file-status');
    const mt = document.getElementById('modal-timer');
    const ms = document.getElementById('modal-sub');
    if(fs) fs.textContent = fileStatus;
    if(mt) mt.textContent = timer;
    if(ms) ms.textContent = sub;
  };

  let allUpdates = {};
  for (let i = 0; i < files.length; i++) {
    setModal(`FILE ${i+1} OF ${files.length}`, '⏳', 'Sending to Gemini...');

    // Retry up to 3 times
    let updates = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        updates = await processScreenshot(files[i]);
        break; // success
      } catch(e) {
        if (attempt < 3) {
          setModal(`FILE ${i+1} OF ${files.length}`, `⚠️`, `Attempt ${attempt} failed. Retrying in 30s...`);
          for (let s = 30; s > 0; s--) {
            setModal(`FILE ${i+1} OF ${files.length}`, `${s}`, `Retry ${attempt+1} of 3 in...`);
            await delay(1000);
          }
        } else {
          setModal(`FILE ${i+1} OF ${files.length}`, `✗`, `Failed after 3 attempts. Skipping.`);
          await delay(2000);
        }
      }
    }

    if (updates) Object.assign(allUpdates, updates);

    // 60 second delay between files
    if (i < files.length - 1) {
      for (let s = 60; s > 0; s--) {
        setModal(`FILE ${i+1} OF ${files.length} ✓`, `${s}`, 'Waiting to avoid rate limit...');
        await delay(1000);
      }
    }
  }

  // Remove modal and release wake lock
  document.getElementById('upload-modal')?.remove();
  try { await wakeLock?.release(); } catch(e) {}

  const res = document.getElementById('upload-results');
  if (Object.keys(allUpdates).length) {
    uploadPreview = allUpdates;
    res.innerHTML = `<div style="background:#0a1520;border:1px solid #0a3050;border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="color:#4a8aaa;font-family:'Orbitron',sans-serif;font-size:10px;margin-bottom:7px">PREVIEW — ${Object.keys(allUpdates).length} CREATURES FOUND</div>
      ${Object.entries(allUpdates).map(([n,d])=>{
        const info = typeof d === 'object' ? d : {dna:d,level:'?',rarity:'?'};
        return `<div class="result-row"><span>Lv.${info.level} ${n} <span style="color:#2a6080;font-size:10px">[${info.rarity}]</span></span><span style="color:#4af">${info.dna.toLocaleString()}</span></div>`;
      }).join('')}
    </div>
    <button class="btn-success" style="width:100%" onclick="confirmUpload()">✓ COMMIT TO TRACKER</button>`;
  } else {
    res.innerHTML = `<div style="color:#f44;text-align:center;padding:14px;font-size:12px">No DNA data found in screenshots.</div>`;
  }
}

let uploadPreview = null;
function confirmUpload() {
  if (!uploadPreview) return;
  Object.assign(dnaInventory, uploadPreview);
  saveInventory();
  uploadPreview = null;
  document.getElementById('upload-results').innerHTML = `<div style="color:#4f4;text-align:center;padding:12px;font-size:12px">✓ Saved to tracker!</div>`;
  renderAll();
}

// Helper to get DNA value regardless of storage format
function getDna(val) { return typeof val === 'number' ? val : (val?.dna || 0); }
function getLevel(val) { return typeof val === 'object' ? (val?.level || '?') : '?'; }
function getRarity(name, val) {
  if (creatureDB[name]?.rarity) return creatureDB[name].rarity;
  return typeof val === 'object' ? (val?.rarity || '?') : '?';
}

async function processScreenshot(file) {
  const b64 = await new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`,
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({contents:[{parts:[
       {inline_data:{mime_type:file.type,data:b64}},
       {text:`This is a Jurassic World Alive screenshot showing creature cards.
For each visible creature extract:
- name (exact in-game name)
- dna (the DNA count number shown)
- level (the level number shown on the card, usually in the bottom-left corner)
- rarity (determined by card border color: green=Common, blue=Rare, purple/pink=Epic, gold/orange=Legendary, teal/green-unique=Unique, red/dark=Apex)

Return ONLY a JSON object like:
{"Velociraptor":{"dna":1250,"level":5,"rarity":"Common"},"Indominus Rex":{"dna":340,"level":2,"rarity":"Legendary"}}
No markdown, no explanation, no extra text.`}
     ]}]})});
  const data = await resp.json();
  if (!data.candidates?.[0]) throw new Error('No response');
  let text = data.candidates[0].content.parts[0].text.trim().replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(text);
  const out = {};
  Object.entries(parsed).forEach(([name, val]) => {
    if (typeof val === 'number') {
      out[name] = {dna: val, level: '?', rarity: '?'};
    } else if (val && typeof val.dna === 'number' && val.dna >= 0) {
      out[name] = {dna: val.dna, level: val.level || '?', rarity: val.rarity || '?'};
    }
  });
  return out;
}

function renderImport() {
  document.getElementById('tab-import').innerHTML = `
    <div style="margin-bottom:12px">
      <div style="font-family:'Orbitron',sans-serif;font-size:10px;color:#4a8aaa;margin-bottom:8px;letter-spacing:1px">PASTE DNA LIST</div>
      <textarea id="import-text" rows="10" placeholder="Velociraptor: 1250&#10;Tyrannosaurus Rex 340&#10;or JSON: {&quot;Velociraptor&quot;: 1250}"></textarea>
    </div>
    <div class="flex-row" style="margin-bottom:14px">
      <button class="btn-primary" onclick="previewImport()" style="flex:1">PREVIEW</button>
      <button class="btn-success" id="confirm-btn" onclick="confirmImport()" style="flex:1;display:none">✓ CONFIRM</button>
    </div>
    <div id="import-preview"></div>
    <div style="margin-top:18px;border-top:1px solid #0a2030;padding-top:14px">
      <div style="font-family:'Orbitron',sans-serif;font-size:10px;color:#4a8aaa;margin-bottom:8px">MANUAL ENTRY</div>
      <div class="flex-row">
        <input type="text" id="manual-name" placeholder="Creature name">
        <input type="number" id="manual-dna" placeholder="DNA" style="width:90px">
        <button class="btn-primary" onclick="addManual()" style="white-space:nowrap">ADD</button>
      </div>
    </div>
    <div style="margin-top:18px;border-top:1px solid #0a2030;padding-top:14px">
      <button class="btn-warn" style="width:100%" onclick="if(confirm('Clear ALL data?')){dnaInventory={};saveInventory();renderAll();}">🗑 CLEAR ALL DATA</button>
    </div>`;
}

let importPreview = null;
function previewImport() {
  const text = document.getElementById('import-text').value.trim();
  if (!text) return;
  let parsed = {};
  try {
    const jm = text.match(/\{[\s\S]*\}/);
    if (jm) { parsed = JSON.parse(jm[0]); }
    else { text.split('\n').forEach(line => { const m=line.trim().match(/^(.+?)[\s:]+(\d+)\s*$/); if(m) parsed[m[1].trim()]=parseInt(m[2]); }); }
  } catch(e) { document.getElementById('import-preview').innerHTML=`<div style="color:#f44;font-size:12px">Parse error: ${e.message}</div>`; return; }
  importPreview = Object.fromEntries(Object.entries(parsed).filter(([,v])=>typeof v==='number'&&v>=0));
  const count = Object.keys(importPreview).length;
  document.getElementById('confirm-btn').style.display = count?'block':'none';
  document.getElementById('import-preview').innerHTML = `
    <div style="background:#0a1520;border:1px solid #0a3050;border-radius:10px;padding:12px">
      <div style="color:#4a8aaa;font-family:'Orbitron',sans-serif;font-size:10px;margin-bottom:7px">PREVIEW: ${count} CREATURES</div>
      ${Object.entries(importPreview).slice(0,20).map(([n,d])=>`<div class="result-row"><span>${n}</span><span style="color:#4af">${d.toLocaleString()}</span></div>`).join('')}
      ${count>20?`<div style="color:#2a6080;font-size:11px;margin-top:5px">...and ${count-20} more</div>`:''}
    </div>`;
}

function confirmImport() {
  if (!importPreview) return;
  Object.assign(dnaInventory, importPreview);
  saveInventory();
  importPreview = null;
  document.getElementById('confirm-btn').style.display='none';
  document.getElementById('import-preview').innerHTML=`<div style="color:#4f4;text-align:center;padding:10px;font-size:12px">✓ Imported!</div>`;
  document.getElementById('import-text').value='';
  renderAll();
}

function addManual() {
  const name = document.getElementById('manual-name').value.trim();
  const dna  = parseInt(document.getElementById('manual-dna').value);
  if (!name||isNaN(dna)||dna<0) return;
  dnaInventory[name]=dna; saveInventory();
  document.getElementById('manual-name').value='';
  document.getElementById('manual-dna').value='';
  renderAll();
}
